name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxfixes-dev \
            libpixman-1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          ARCH="x86_64-unknown-linux-gnu"
          ARCHIVE_DIR="termway-${TAG_NAME}-${ARCH}"
          mkdir -p "${ARCHIVE_DIR}"
          
          # Strip debug symbols to reduce binary size
          strip target/release/termway
          
          # Bundle binary and license/readme
          cp target/release/termway "${ARCHIVE_DIR}/"
          cp README.md README.ja.md LICENSE "${ARCHIVE_DIR}/"
          
          # Create compressed archive
          tar -czf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          
          # Generate SHA256 checksum
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            termway-*-x86_64-unknown-linux-gnu.tar.gz
            termway-*-x86_64-unknown-linux-gnu.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
