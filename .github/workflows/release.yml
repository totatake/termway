name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            strip_cmd: strip
            is_cross: false
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            strip_cmd: aarch64-linux-gnu-strip
            is_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup multiarch aarch64 (for cross-build)
        if: matrix.is_cross
        run: sudo ./scripts/setup_cross_aarch64.sh

      - name: Install native build dependencies
        if: "!matrix.is_cross"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxfixes-dev \
            libpixman-1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (native)
        if: "!matrix.is_cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.is_cross
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          ARCH="${{ matrix.target }}"
          ARCHIVE_DIR="termway-${TAG_NAME}-${ARCH}"
          mkdir -p "${ARCHIVE_DIR}"
          
          # Strip debug symbols to reduce binary size
          ${{ matrix.strip_cmd }} target/${ARCH}/release/termway
          
          # Bundle binary and license/readme
          cp target/${ARCH}/release/termway "${ARCHIVE_DIR}/"
          cp README.md README.ja.md LICENSE "${ARCHIVE_DIR}/"
          
          # Create compressed archive
          tar -czf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          
          # Generate SHA256 checksum
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: termway-${{ matrix.target }}
          path: |
            termway-*-${{ matrix.target }}.tar.gz
            termway-*-${{ matrix.target }}.tar.gz.sha256
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-22.04
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/termway-*.tar.gz
            release-artifacts/termway-*.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
