[package]
name = "termway"
version = "0.12.0"
edition = "2021"
authors = ["termway developers"]
description = "In-terminal Wayland and X11 GUI bridge powered by Smithay"
license = "MIT"
readme = "README.md"
keywords = ["wayland", "x11", "terminal", "kitty-graphics", "sixel"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
base64 = "0.22"
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["fs", "term", "signal", "ioctl", "process", "poll"] }
pixman = "0.2"
smithay = { version = "0.7", default-features = false, features = ["desktop", "renderer_pixman", "wayland_frontend", "xwayland"] }
tempfile = "3.27"
x11rb = { version = "0.13", features = ["shape"] }
miniz_oxide = "0.8"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"], optional = true }

[features]
default = ["zlib-ng"]
zlib-ng = ["dep:flate2"]

[[bin]]
name = "termway"
path = "src/main.rs"

[lib]
name = "termway"
path = "src/lib.rs"

[dev-dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

