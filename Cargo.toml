[package]
name = "termway"
version = "0.1.0"
edition = "2021"
authors = ["termway developers"]
description = "In-terminal X11 GUI "

[dependencies]
base64 = "0.22"
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["fs", "term", "signal", "ioctl", "process", "poll"] }
x11 = { version = "2.21", features = ["xlib", "xtest", "xfixes", "dpms"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pixman = "0.2"
smithay = { version = "0.7", default-features = false, features = ["desktop", "renderer_pixman", "wayland_frontend", "xwayland"] }

[[bin]]
name = "termway"
path = "src/main.rs"

[lib]
name = "termway"
path = "src/lib.rs"

[dev-dependencies]
libc = "0.2"
